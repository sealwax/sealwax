[package]
name = "sealwax-compose"
description = "PDF documents written from laid-out pages: glyphs, paths, pictures and links."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
# Resume publication when the subsetter fix is available on crates.io.
publish = false

[dependencies]
sealwax-core.workspace = true
# Content streams compressed (MIT OR Apache-2.0); already in the tree.
flate2 = "1"
# Font programs read: tables, `cmap`, advances, names (MIT OR Apache-2.0); already in the tree.
read-fonts = "0.46"
# Cut TrueType and CFF fonts to the glyphs drawn (MIT OR Apache-2.0).
# Return to crates.io once typst/subsetter#42 is released.
subsetter = { git = "https://github.com/sboily/subsetter", rev = "3cd654aafd4b855c1628cd34bf2cede3d86e2d17" }
thiserror.workspace = true

[dev-dependencies]
# The tests read back and render what is composed. These crates depend on this one (through
# sealwax-annots): without a version, they are left out of the crate published, so that the
# workspace packages each crate after those it depends on.
sealwax-raster = { path = "../sealwax-raster" }
sealwax-text = { path = "../sealwax-text" }

[lints]
workspace = true
