[package]
name = "sealwax-compose"
description = "PDF documents written from laid-out pages: glyphs, paths, pictures and links."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
sealwax-core.workspace = true
# Content streams compressed (MIT OR Apache-2.0); already in the tree.
flate2 = "1"
# Font programs read: tables, `cmap`, advances, names (MIT OR Apache-2.0); already in the tree.
read-fonts = "0.46"
# Cut TrueType and CFF fonts to the glyphs drawn (MIT OR Apache-2.0). What 0.2.6 panics on is
# refused before it runs (`src/subset_guard.rs`).
subsetter = "0.2.6"
thiserror.workspace = true

[dev-dependencies]
# The tests read back and render what is composed. These crates depend on this one (through
# sealwax-annots): without a version, they are left out of the crate published, so that the
# workspace packages each crate after those it depends on.
sealwax-raster = { path = "../sealwax-raster" }
sealwax-text = { path = "../sealwax-text" }

[lints]
workspace = true
