[package]
name = "sealwax-convert"
description = "Other formats converted to PDF: laid out by an engine of their own, written by sealwax-compose."
version.workspace = true
edition.workspace = true
# docxide-pdf needs a newer compiler than the rest of the workspace (if-let guards).
rust-version = "1.97"
license.workspace = true
repository.workspace = true
authors.workspace = true
# Depends on docxide-pdf from git until it publishes its display list: crates.io refuses that.
publish = false

[dependencies]
sealwax-core.workspace = true
sealwax-compose.workspace = true
# DOCX laid out to a display list (Apache-2.0), proposed upstream in sverrejb/docxide-pdf#168;
# here with its marked content, structure tree, outline and PDF/UA claim. Branch `sealwax-crate`
# of the fork holds snapshots of the files docxide-pdf publishes on crates.io, taken from its
# branch `sealwax`, without the repository's history (1.4 GB with its fixtures).
docxide-pdf = { git = "https://github.com/sboily/docxide-pdf", rev = "c7ab58b16605b3f4a3678e3b0588e9aa6d00686b", default-features = false }
thiserror.workspace = true
# The archive's parts and their sizes, read before the layout: the same crate docxide-pdf reads
# them with, so both see the same parts.
zip = { version = "9.4", default-features = false }

[dev-dependencies]
sealwax-raster.workspace = true
sealwax-text.workspace = true

[lints]
workspace = true
