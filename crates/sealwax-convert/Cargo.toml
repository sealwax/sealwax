[package]
name = "sealwax-convert"
description = "Other formats converted to PDF: laid out by an engine of their own, written by sealwax-compose."
version.workspace = true
edition.workspace = true
# docxide-pdf needs a newer compiler than the rest of the workspace (if-let guards).
rust-version = "1.97"
license.workspace = true
repository.workspace = true
authors.workspace = true
# Depends on sealwax-compose, which is not published yet.
publish = false

[dependencies]
sealwax-core.workspace = true
sealwax-compose.workspace = true
# DOCX laid out to a display list (Apache-2.0), with its marked content, structure tree and
# outline. `cli` (the default) is its command line.
docxide-pdf = { version = "0.22.0", default-features = false }
thiserror.workspace = true
# The archive's parts and their sizes, read before the layout: the same crate docxide-pdf reads
# them with, so both see the same parts.
zip = { version = "9.4", default-features = false }

[dev-dependencies]
sealwax-raster.workspace = true
sealwax-text.workspace = true

[lints]
workspace = true
