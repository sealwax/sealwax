# cargo-about: the licences of the Rust crates compiled into the Python module, written into
# licenses/DEPENDENCIES.md when releasing (see .github/workflows/release.yml). The licences
# accepted are those deny.toml allows.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    "MPL-2.0",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
