[package]
name = "sealwax-annots"
description = "XFDF applied to PDF documents, annotations flattened into their pages."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
sealwax-core.workspace = true
# Redaction marks applied: what the page draws under them taken out.
sealwax-text.workspace = true
thiserror.workspace = true
serde_json.workspace = true
flate2 = "1"
quick-xml = "0.42.0"
png = "0.18.1"
base64 = "0.23.1"
serde = { workspace = true, optional = true }

[features]
default = []
serde = ["dep:serde", "sealwax-text/serde"]

[lints]
workspace = true

[dev-dependencies]
flate2 = "1"
