[package]
name = "sealwax-text"
description = "What PDF pages draw: glyphs with their text and boxes, lines and rectangles; and redaction."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
sealwax-core.workspace = true
# Interprets content streams, fonts and CMaps. It turns on the `images` and `unsafe` features of
# hayro-syntax, which sealwax-core keeps off: this crate is kept apart so that opening and saving
# documents do not depend on them.
hayro-interpret = "0.9"
# The fonts hayro-interpret reads, used directly to split a string into codes and know each code's
# advance when text is redacted (Apache-2.0 OR MIT, the same project; its features come from
# hayro-interpret).
hayro-font = { version = "0.5", default-features = false }
flate2 = "1"
# Keeps a parsed document beside the interpreter cache that borrows from it, so that a document's
# fonts are parsed once rather than on every call (Apache-2.0 OR GPL-2.0-only, used as Apache-2.0;
# no dependencies, no procedural macro).
self_cell = "1.3"
serde = { workspace = true, optional = true }

[features]
default = []
serde = ["dep:serde"]

[lints]
workspace = true
