[package]
name = "sealwax-core"
description = "Core of sealwax: opening PDF documents, their pages and geometry, full and incremental saves."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
flate2 = "1"
hayro-syntax.workspace = true
# Finds the structure streams in a whole file when it opens, vectorised (MIT OR Unlicense).
memchr = "2.7"
sha2 = "0.11"
serde = { workspace = true, optional = true }
thiserror.workspace = true

[features]
default = []
serde = ["dep:serde"]

[lints]
workspace = true
