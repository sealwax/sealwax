[package]
name = "sealwax-core"
description = "Core of sealwax: opening PDF documents, their pages and geometry, full and incremental saves."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
flate2 = "1"
hayro-syntax.workspace = true
# Finds the structure streams in a whole file when it opens, vectorised (MIT OR Unlicense).
memchr = "2.7"
# The deadline's clock: `std::time::Instant` itself on every target but the browser, where it
# reads `performance.now()` (std's panics there). MIT OR Apache-2.0.
web-time = "1.1"
sha2 = "0.11"
# Saving encrypted: the AES block cipher (CBC written here) and MD5 for the key of revisions 3
# and 4 (MIT OR Apache-2.0, RustCrypto, no unsafe in the portable code paths used).
aes = "0.9"
md-5 = "0.11"
serde = { workspace = true, optional = true }
thiserror.workspace = true

[features]
default = []
serde = ["dep:serde"]

[lints]
workspace = true
