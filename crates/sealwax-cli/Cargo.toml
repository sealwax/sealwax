[package]
name = "sealwax-cli"
description = "Command-line tool of sealwax: inspect documents, survey a corpus."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "sealwax"
path = "src/main.rs"

[dependencies]
sealwax = { workspace = true, features = ["serde"] }
sealwax-text = { workspace = true, features = ["serde"] }
sealwax-pdfa = { workspace = true, features = ["serde"] }
sealwax-annots = { workspace = true, features = ["serde"] }
sealwax-raster.workspace = true
sealwax-sign.workspace = true
clap = { version = "4.6", features = ["derive"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11"

[lints]
workspace = true
