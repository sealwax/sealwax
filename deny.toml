# cargo-deny: licences and advisories of every dependency.
# Licences allowed: permissive ones compatible with MIT OR Apache-2.0, no copyleft.

[graph]
all-features = true

[advisories]
version = 2
ignore = [
    # ttf-parser is unmaintained (no known vulnerability). Only docxide-pdf uses it, for
    # sealwax-convert, which the Python package ships (`docx_to_pdf`): it reads the fonts of the
    # DOCX files converted, untrusted ones included. Kept until docxide-pdf moves to a maintained
    # parser; the README asks to convert untrusted documents in a process of their own.
    { id = "RUSTSEC-2026-0192", reason = "unmaintained, no known vulnerability; docxide-pdf only, for sealwax-convert in the Python package (docx_to_pdf)" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    # Allowed as a dependency only, never copied into our files.
    "MPL-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# docxide-pdf with its display list, from a fork until it publishes one: sealwax-convert only,
# which is not published.
allow-git = ["https://github.com/sboily/docxide-pdf"]
