name: Release

# On a `release/**` branch: build and test what a release would publish, publish nothing.
# On a `v*` tag: the same, then publish the crates on crates.io and the wheels on PyPI, and make
# the GitHub release. The tag must name the workspace's version.

on:
  push:
    branches: ["release/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Tag matches the version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not name the workspace version $version" >&2
            exit 1
          fi

  crates:
    name: Crates (packaged and verified)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo package --workspace --exclude sealwax-py

  wheels:
    name: Wheel (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            target: x86_64
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64
          - name: macos-arm64
            runner: macos-latest
            target: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: Licences of the compiled crates
        working-directory: crates/sealwax-py
        run: cargo about generate --locked -c about.toml -o licenses/DEPENDENCIES.md about.hbs
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: "2_28"
          args: --release --out dist -m crates/sealwax-py/Cargo.toml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Licences in the wheel
        shell: bash
        run: python -I .github/scripts/check_licences.py dist/*.whl
      - name: Test the wheel
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl pytest cryptography
          cd crates/sealwax-py
          "$RUNNER_TEMP/venv/bin/python" -m pytest -q tests
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: Licences of the compiled crates
        working-directory: crates/sealwax-py
        run: cargo about generate --locked -c about.toml -o licenses/DEPENDENCIES.md about.hbs
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist -m crates/sealwax-py/Cargo.toml
      - name: Licences in the source distribution
        run: python3 -I .github/scripts/check_licences.py dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  pypi:
    name: Publish on PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, crates, wheels, sdist]
    runs-on: ubuntu-latest
    # PyPI trusted publishing: no token; the `pypi` environment is the one PyPI trusts.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1

  crates-io:
    name: Publish on crates.io
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, crates, wheels, sdist]
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --workspace --exclude sealwax-py
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  github-release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [pypi, crates-io]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release with the changelog's section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "sealwax $version" --notes-file notes.md
