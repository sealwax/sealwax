name: Release

# On a `release/**` branch: build and test what a release would publish, publish nothing.
# On a `v*` tag: the same, then publish the crates on crates.io, the wheels on PyPI and the
# WebAssembly package on npm, and make the GitHub release. The tag must name the workspace's
# version.

on:
  push:
    branches: ["release/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Tag matches the version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not name the workspace version $version" >&2
            exit 1
          fi

  crates:
    name: Crates (packaged and verified)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo package --workspace --exclude sealwax-py

  wheels:
    name: Wheel (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            target: x86_64
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64
          - name: macos-arm64
            runner: macos-latest
            target: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: Licences of the compiled crates
        working-directory: crates/sealwax-py
        run: cargo about generate --locked -c about.toml -o licenses/DEPENDENCIES.md about.hbs
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: "2_28"
          args: --release --out dist -m crates/sealwax-py/Cargo.toml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Licences in the wheel
        shell: bash
        run: python -I .github/scripts/check_licences.py dist/*.whl
      - name: Test the wheel
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl pytest cryptography
          cd crates/sealwax-py
          "$RUNNER_TEMP/venv/bin/python" -m pytest -q tests
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: Licences of the compiled crates
        working-directory: crates/sealwax-py
        run: cargo about generate --locked -c about.toml -o licenses/DEPENDENCIES.md about.hbs
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist -m crates/sealwax-py/Cargo.toml
      - name: Licences in the source distribution
        run: python3 -I .github/scripts/check_licences.py dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  npm-package:
    name: npm package (WebAssembly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # The wasm-bindgen CLI must be the version the crate pins.
      - name: wasm-bindgen version
        id: bindgen
        run: echo "version=$(sed -n 's/^wasm-bindgen = "=\(.*\)"/\1/p' crates/sealwax-wasm/Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.bindgen.outputs.version }},cargo-about
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build
        run: crates/sealwax-wasm/build.sh
      - name: Test
        run: node --test crates/sealwax-wasm/tests/package.test.mjs crates/sealwax-wasm/tests/node.test.mjs
      # Its declarations compile in a project that imports them (TypeScript pinned).
      - name: Type-check a consumer
        run: npx --yes -p typescript@5.8.3 tsc -p crates/sealwax-wasm/tests/types
      - name: Pack
        run: |
          test -s crates/sealwax-wasm/pkg/licenses/DEPENDENCIES.md
          mkdir -p dist
          npm pack ./crates/sealwax-wasm/pkg --pack-destination dist
      - uses: actions/upload-artifact@v4
        with:
          name: npm
          path: dist/*.tgz

  pypi:
    name: Publish on PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, crates, wheels, sdist]
    runs-on: ubuntu-latest
    # PyPI trusted publishing: no token; the `pypi` environment is the one PyPI trusts.
    environment: pypi
    permissions:
      id-token: write
    steps:
      # The wheels and the source distribution only: nothing else goes to PyPI.
      - uses: actions/download-artifact@v4
        with:
          pattern: "{wheel-*,sdist}"
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1

  crates-io:
    name: Publish on crates.io
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, crates, wheels, sdist]
    runs-on: ubuntu-latest
    # crates.io trusted publishing: no stored token; the `crates-io` environment is the one each
    # crate trusts, and the token this job gets lasts 30 minutes.
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      # Each crate after those it depends on; a version already published is skipped, so that a
      # run stopped by crates.io's rate limit is finished by running this job again.
      - run: python3 -I .github/scripts/publish_crates.py
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  npm:
    name: Publish on npm
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, crates, npm-package]
    runs-on: ubuntu-latest
    # npm trusted publishing: the `npm` environment is the one the package trusts, and npm makes
    # the provenance attestation. NPM_TOKEN, in that environment, serves only the very first
    # publish, before the package exists to trust anything; it is deleted afterwards.
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install --global npm@^11.5.1
      - run: npm publish dist/*.tgz --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [pypi, crates-io, npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release with the changelog's section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "sealwax $version" --notes-file notes.md
