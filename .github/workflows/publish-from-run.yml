name: Finish a release from its run

# A release whose GitHub release failed is finished from its own run: what that run built and
# tested is attached, never rebuilt, and its tag cannot move (the ruleset keeps release tags in
# place). The registries are not here: their jobs are re-run in the release run itself (npm
# trusts release.yml alone).

on:
  workflow_dispatch:
    inputs:
      run:
        description: The id of the release run of a tag (Actions, release.yml)
        required: true

permissions:
  contents: read

jobs:
  run:
    name: The release run
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      tag: ${{ steps.run.outputs.tag }}
    steps:
      - id: run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ inputs.run }}
        run: |
          tag=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" \
            --jq 'select(.path == ".github/workflows/release.yml" and .event == "push") | .head_branch')
          case "$tag" in
            v*) echo "tag=$tag" >> "$GITHUB_OUTPUT" ;;
            *) echo "run $RUN is no release run of a tag" >&2; exit 1 ;;
          esac

  github-release:
    name: GitHub release
    needs: run
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.run.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          run-id: ${{ inputs.run }}
          github-token: ${{ github.token }}
      - name: Release with the changelog's section
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.run.outputs.tag }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          gh release create "$TAG" dist/* --title "sealwax $version" --notes-file notes.md
