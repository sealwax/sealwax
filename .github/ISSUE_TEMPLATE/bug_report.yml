name: Bug report
description: Something sealwax does wrong, or refuses wrongly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. **Never attach a document that holds personal or
        confidential data.** Security issues go through private reporting instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what sealwax did instead (error message included).
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The smallest code and input that show it. A synthetic PDF or XFDF is ideal.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: sealwax version or commit, and whether you use Rust, Python or the command line.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Operating system, Rust or Python version.
