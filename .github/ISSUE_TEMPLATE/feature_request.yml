name: Feature request
description: Something sealwax could do.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: The need
      description: What you are trying to do, and why sealwax does not do it today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How you see it working, if you have an idea. References to the PDF, PDF/A or PAdES standards help.
