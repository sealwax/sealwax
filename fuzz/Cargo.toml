[package]
name = "sealwax-fuzz"
description = "Fuzz targets of sealwax (cargo-fuzz, nightly)."
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
sealwax-core = { path = "../crates/sealwax-core" }
sealwax-text = { path = "../crates/sealwax-text" }
sealwax-pdfa = { path = "../crates/sealwax-pdfa" }
sealwax-annots = { path = "../crates/sealwax-annots" }
sealwax-raster = { path = "../crates/sealwax-raster" }
sealwax-sign = { path = "../crates/sealwax-sign" }
sealwax-compose = { path = "../crates/sealwax-compose" }
sealwax-convert = { path = "../crates/sealwax-convert" }

[patch.crates-io]
# Use the same subsetter for docxide-pdf and sealwax-compose.
subsetter = { git = "https://github.com/sboily/subsetter", rev = "3cd654aafd4b855c1628cd34bf2cede3d86e2d17" }

[[bin]]
name = "open"
path = "fuzz_targets/open.rs"
test = false
doc = false
bench = false

[[bin]]
name = "save"
path = "fuzz_targets/save.rs"
test = false
doc = false
bench = false

[[bin]]
name = "text"
path = "fuzz_targets/text.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pdfa"
path = "fuzz_targets/pdfa.rs"
test = false
doc = false
bench = false

[[bin]]
name = "annots"
path = "fuzz_targets/annots.rs"
test = false
doc = false
bench = false

[[bin]]
name = "xfdf"
path = "fuzz_targets/xfdf.rs"
test = false
doc = false
bench = false

[[bin]]
name = "photos"
path = "fuzz_targets/photos.rs"
test = false
doc = false
bench = false

[[bin]]
name = "merge"
path = "fuzz_targets/merge.rs"
test = false
doc = false
bench = false

[[bin]]
name = "raster"
path = "fuzz_targets/raster.rs"
test = false
doc = false
bench = false

[[bin]]
name = "timestamp"
path = "fuzz_targets/timestamp.rs"
test = false
doc = false
bench = false

[[bin]]
name = "revocation"
path = "fuzz_targets/revocation.rs"
test = false
doc = false
bench = false

[[bin]]
name = "verify"
path = "fuzz_targets/verify.rs"
test = false
doc = false
bench = false

[[bin]]
name = "compose"
path = "fuzz_targets/compose.rs"
test = false
doc = false
bench = false

[[bin]]
name = "convert"
path = "fuzz_targets/convert.rs"
test = false
doc = false
bench = false

[[bin]]
name = "structure"
path = "fuzz_targets/structure.rs"
test = false
doc = false
bench = false

# Its own workspace: fuzzing builds with nightly and sanitizer flags the main workspace never uses.
[workspace]
members = ["."]
